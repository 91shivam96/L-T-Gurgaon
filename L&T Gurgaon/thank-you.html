<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - L&T Sector 86 Gurgaon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .thank-you-container {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .thank-you-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #0066CC 0%, #10B981 100%);
        }

        .success-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
        }

        .success-icon svg {
            width: 50px;
            height: 50px;
            stroke: white;
            stroke-width: 3;
            fill: none;
        }

        .enquiry-received {
            color: #0066CC;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .thank-you-title {
            font-size: 48px;
            font-weight: 800;
            color: #1A1A2E;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .thank-you-description {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .back-btn {
            background: linear-gradient(135deg, #0066CC 0%, #004499 100%);
            color: white;
            padding: 16px 40px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 10px 30px rgba(0, 102, 204, 0.3);
        }

        .back-btn:hover {
            background: linear-gradient(135deg, #004499 0%, #0066CC 100%);
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 102, 204, 0.4);
        }

        @media (max-width: 768px) {
            .thank-you-container {
                padding: 40px 20px;
            }

            .thank-you-title {
                font-size: 36px;
            }

            .success-icon {
                width: 80px;
                height: 80px;
            }

            .success-icon svg {
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="thank-you-container">
        <div class="success-icon">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>
        <div class="enquiry-received">ENQUIRY RECEIVED</div>
        <h1 class="thank-you-title">Thank You</h1>
        <p class="thank-you-description">
            Your enquiry has been successfully submitted. Our team will contact you shortly with the L&T Sector 86 Gurgaon project details, including pricing, floor plans, and availability information.
        </p>
        <a href="index.html" class="back-btn">BACK TO PROJECT</a>
    </div>
</body>
</html>
